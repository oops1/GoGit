version: "2"
run:
  timeout: 15m
linters:
  default: standard
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - gocritic
    - revive
    - errorlint
    - gosec
  settings:
    govet:
      disable:
        - unsafeptr
    errcheck:
      exclude-functions:
        - (*os.File).Close
        - (*os.Root).Close
        - (io.Closer).Close
        - (golang.org/x/sys/windows/registry.Key).Close
        - (*github.com/oops1/gogit/internal/logx.Logger).Close
        - os.Unsetenv
    errorlint:
      errorf: false
    gosec:
      excludes:
        - G301
        - G302
        - G304
        - G306
        - G115
        - G401
        - G505
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
  exclusions:
    rules:
      - path: internal/winconsole/console_windows\.go
        linters:
          - gosec
        text: "G103"
      - path: internal/vault/dpapi_windows\.go
        linters:
          - gosec
        text: "G103"
      - path: internal/gitcore/transport/agent_windows\.go
        linters:
          - gosec
        text: "G103"
      - path: internal/gitcore/transport/agent_other\.go
        linters:
          - gosec
        text: "G704"
      - path: internal/gitcore/transport/httptls\.go
        linters:
          - gosec
        text: "G402"
      - path: internal/gitcore/transport/ntlm\.go
        linters:
          - gosec
      - path: internal/gitcore/transport/channelbinding\.go
        linters:
          - gosec
        text: "G501"
      - path: internal/gitcore/transport/ntlm\.go
        linters:
          - staticcheck
        text: "SA1019"
      - path: internal/gitcore/transport/sspi_windows\.go
        linters:
          - gosec
        text: "G103"
      - path: internal/gitcore/transport/httpproxy_test\.go
        linters:
          - gosec
      - path: internal/gitcore/credential/wincredapi_windows\.go
        linters:
          - gosec
        text: "G103"
      - path: internal/gitcore/credential/.*_test\.go
        linters:
          - gosec
      - path: internal/gitcore/hooks/.*\.go
        linters:
          - gosec
        text: "G204"
      - path: internal/gitcore/hooks/.*_test\.go
        linters:
          - gosec
      - path: internal/app/openurl_(windows|linux)\.go
        linters:
          - gosec
        text: "G204"
      - path: internal/app/reveal_(windows|linux)\.go
        linters:
          - gosec
        text: "G204"
      - path: internal/app/about_test\.go
        linters:
          - gosec
      - path: internal/ui/icons/preview_test\.go
        linters:
          - gosec
        text: "G703"
      - path: internal/ui/settings/editors\.go
        linters:
          - gosec
        text: "G101"
      - path: internal/gitcore/(linelog|revision)/graph_test\.go
        linters:
          - gosec
        text: "G404"
formatters:
  enable:
    - gofmt
    - goimports
