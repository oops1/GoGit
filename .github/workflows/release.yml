name: release

on:
  push:
    tags:
      - v*

env:
  CGO_ENABLED: "0"

jobs:
  msi:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
      - name: install wix
        run: |
          dotnet tool install --global wix --version 5.0.2
          echo "$USERPROFILE/.dotnet/tools" >> "$GITHUB_PATH"
          "$USERPROFILE/.dotnet/tools/wix" extension add -g WixToolset.UI.wixext/5.0.2
      - name: build the executable
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd cmd/gogit
          go run github.com/tc-hib/go-winres@v0.3.3 make --in winres/winres.json --arch amd64 --file-version "$version" --product-version "$version"
          cd ../..
          go build -trimpath -ldflags "-s -w -H windowsgui -X github.com/oops1/gogit/internal/version.Version=$GITHUB_REF_NAME" -o dist/windows-amd64/gogit.exe ./cmd/gogit
      - name: build msi
        run: |
          version="${GITHUB_REF_NAME#v}"
          wix build packaging/windows/gogit.wxs -arch x64 -ext WixToolset.UI.wixext             -d ProductVersion="$version"             -d GogitExePath=dist/windows-amd64/gogit.exe             -o "dist/gogit-$GITHUB_REF_NAME-windows-amd64.msi"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: dist/*.msi
          if-no-files-found: error

  build:
    needs: msi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
      - name: windows resources
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd cmd/gogit
          go run github.com/tc-hib/go-winres@v0.3.3 make --in winres/winres.json --arch amd64             --file-version "$version" --product-version "$version"
      - run: mkdir -p dist/windows-amd64 dist/linux-amd64 dist/linux-arm64

      - name: build windows amd64
        run: GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -H windowsgui -X github.com/oops1/gogit/internal/version.Version=${{ github.ref_name }}" -o dist/windows-amd64/gogit.exe ./cmd/gogit

      - name: build linux amd64
        run: GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X github.com/oops1/gogit/internal/version.Version=${{ github.ref_name }}" -o dist/linux-amd64/gogit ./cmd/gogit

      - name: build linux arm64
        run: GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w -X github.com/oops1/gogit/internal/version.Version=${{ github.ref_name }}" -o dist/linux-arm64/gogit ./cmd/gogit

      - name: package windows
        run: |
          cd dist/windows-amd64
          cp ../../LICENSE ../../NOTICE .
          zip -r ../gogit-${{ github.ref_name }}-windows-amd64.zip gogit.exe LICENSE NOTICE
          cd ../..

      - name: package linux amd64
        run: |
          cd dist/linux-amd64
          cp ../../LICENSE ../../NOTICE .
          tar czf ../gogit-${{ github.ref_name }}-linux-amd64.tar.gz gogit LICENSE NOTICE
          cd ../..

      - name: package linux arm64
        run: |
          cd dist/linux-arm64
          cp ../../LICENSE ../../NOTICE .
          tar czf ../gogit-${{ github.ref_name }}-linux-arm64.tar.gz gogit LICENSE NOTICE
          cd ../..

      - uses: actions/download-artifact@v4
        with:
          name: windows-msi
          path: dist

      - name: compute checksums
        run: cd dist && sha256sum gogit-*.zip gogit-*.tar.gz gogit-*.msi > SHA256SUMS && cat SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/gogit-*.zip
            dist/gogit-*.tar.gz
            dist/gogit-*.msi
            dist/SHA256SUMS
          body_path: RELEASE_NOTES.md
