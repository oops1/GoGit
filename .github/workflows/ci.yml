name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  CGO_ENABLED: "0"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go vet -unsafeptr=false ./...
      - run: go build ./...
      - name: race tests
        env:
          CGO_ENABLED: "1"
        run: |
          set +e
          go test -count=1 -race ./... 2>&1 | tee race.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "^(--- )?FAIL|^\s+--- FAIL|panic:|^\s+.*_test\.go:" race.log | head -40 |
              while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit "$status"
      - name: oracle tests with coverage
        run: |
          set +e
          go test -count=1 -tags oracle -coverprofile=cover.out -covermode=atomic ./... 2>&1 | tee oracle.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "^(--- )?FAIL|^\s+--- FAIL|panic:|^\s+.*_test\.go:" oracle.log | head -40 |
              while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit "$status"
      - name: coverage gate
        shell: bash
        run: |
          total=$(go tool cover -func=cover.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "total coverage: $total%"
          awk -v t="$total" 'BEGIN { if (t + 0 < 90) { print "coverage below 90%"; exit 1 } }'

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: GOOS=windows GOARCH=amd64 go build -ldflags "-H windowsgui" -o dist/gogit.exe ./cmd/gogit
      - run: GOOS=linux GOARCH=amd64 go build -o dist/gogit ./cmd/gogit
      - run: GOOS=linux GOARCH=arm64 go build -o dist/gogit-arm64 ./cmd/gogit

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
          install-mode: goinstall
