name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/develop' }}

env:
  CGO_ENABLED: "0"

jobs:
  changes:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.tree.outputs.suites }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: tree
        run: |
          suites=true
          if [ "${{ github.event_name }}" = push ] && [ "${{ github.ref }}" = refs/heads/main ]; then
            tree=$(git rev-parse 'HEAD^{tree}')
            if git log origin/develop --format=%T | grep -qx "$tree"; then
              suites=false
              echo "::notice::main holds a tree already tested on develop; test suites are skipped"
            fi
          fi
          echo "suites=$suites" >> "$GITHUB_OUTPUT"

  suites-ubuntu:
    needs: changes
    if: needs.changes.outputs.suites == 'true'
    name: ${{ matrix.suite }} (ubuntu-latest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [race-ops, race-app, race-rest, oracle-ops, oracle-app, oracle-rest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false
      - id: goenv
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            ${{ steps.goenv.outputs.build }}
            ${{ steps.goenv.outputs.modules }}
          key: go-${{ runner.os }}-${{ matrix.suite }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ matrix.suite }}-
      - run: bash .github/ci/suite.sh ${{ matrix.suite }}

  suites-windows:
    needs: changes
    if: needs.changes.outputs.suites == 'true'
    name: ${{ matrix.suite }} (windows-latest)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [race-ops, race-app, race-rest, oracle-ops, oracle-app, oracle-rest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false
      - id: goenv
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            ${{ steps.goenv.outputs.build }}
            ${{ steps.goenv.outputs.modules }}
          key: go-${{ runner.os }}-${{ matrix.suite }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ matrix.suite }}-
      - run: bash .github/ci/suite.sh ${{ matrix.suite }}

  test-ubuntu:
    needs: [changes, suites-ubuntu]
    if: ${{ !cancelled() && needs.changes.result == 'success' }}
    name: test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ needs.changes.outputs.suites }}" = true ] && [ "${{ needs.suites-ubuntu.result }}" != success ]; then
            echo "::error::ubuntu suites ended with ${{ needs.suites-ubuntu.result }}"
            exit 1
          fi

  test-windows:
    needs: [changes, suites-windows]
    if: ${{ !cancelled() && needs.changes.result == 'success' }}
    name: test (windows-latest)
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ needs.changes.outputs.suites }}" = true ] && [ "${{ needs.suites-windows.result }}" != success ]; then
            echo "::error::windows suites ended with ${{ needs.suites-windows.result }}"
            exit 1
          fi

  cross-build:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - run: GOOS=windows GOARCH=amd64 go build -ldflags "-H windowsgui" -o dist/gogit.exe ./cmd/gogit
      - run: GOOS=linux GOARCH=amd64 go build -o dist/gogit ./cmd/gogit
      - run: GOOS=linux GOARCH=arm64 go build -o dist/gogit-arm64 ./cmd/gogit

  lint:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
