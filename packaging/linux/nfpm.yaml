name: gogit
arch: ${ARCH}
platform: linux
version: ${VERSION}
maintainer: oops1 <oops1.vc@gmail.com>
description: |
  Free desktop git client with its own pure-Go git implementation.
  No system git is required.
homepage: https://github.com/oops1/gogit
license: Apache-2.0
section: vcs
priority: optional

contents:
  - src: dist/linux-amd64/gogit
    dst: /usr/bin/gogit
    file_info:
      mode: 0755

  - src: packaging/linux/gogit.desktop
    dst: /usr/share/applications/gogit.desktop
    file_info:
      mode: 0644

  - src: internal/assets/icons/app.svg
    dst: /usr/share/icons/hicolor/scalable/apps/gogit.svg
    file_info:
      mode: 0644

  - src: LICENSE
    dst: /usr/share/doc/gogit/LICENSE
    file_info:
      mode: 0644

  - src: NOTICE
    dst: /usr/share/doc/gogit/NOTICE
    file_info:
      mode: 0644
